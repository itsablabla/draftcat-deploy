# draftcat configuration — Hostim build
# Based on upstream https://github.com/renezander030/draftcat config.yaml
# Provider points at the Manifest gateway (app.manifest.build/v1, model auto).
# webhook + tool_gate are ENABLED (0.0.0.0:8088) so the operator agent stack
# (incl. KERNEL web MCP) can route tool calls through /gate/tool-call and the
# public URL serves /healthz. Secrets stay in Hostim app env, never in this repo.
telegram:
  token_env: DRAFTCAT_TG_TOKEN
  secrets_file: secrets.yaml      # chat_id + allowed_users (gitignored)
  # REQUIRED — engine refuses to start without this
  security:
    max_input_length: 500         # max chars per operator message
    rate_limit: 10                # max messages per minute per user
    strip_markdown: true          # strip formatting that could break prompt boundaries

gmail:
  token_path: /root/.config/google-gmail-token.json
  permission: send          # read + send (with HITL approval)

gohighlevel:
  # Option A: Private integration token (single location)
  api_key_env: GHL_API_KEY
  location_id: your-location-id
  # Option B: OAuth (marketplace apps) — uncomment below
  # client_id: your-client-id
  # client_secret: your-client-secret
  # token_path: ~/.config/ghl-token.json
  permission: write         # read | write (write = send messages with HITL approval)

provider:
  type: openai
  api_key_env: MANIFEST_API_KEY
  base_url: https://app.manifest.build/v1
  usage_accounting: false

models:
  haiku:
    model: auto
    max_tokens: 4096
    cost_per_1k_input: 0.0001
    cost_per_1k_output: 0.0005
  gpt-4o-mini:
    model: auto
    max_tokens: 1024
    cost_per_1k_input: 0.00015
    cost_per_1k_output: 0.0006

roles:
  classifier: gpt-4o-mini
  drafter: gpt-4o-mini

budgets:
  per_step_tokens: 2048
  per_pipeline_tokens: 10000
  per_day_tokens: 100000

timeouts:
  ai_call: 60s                  # was 30s; summarize latency hit 27.7–29.9s (2026-10-24/25) [patch 0002 also retries once on timeout]
  operator_approval: 4h
  pipeline_total: 5m

observability:
  spans: false

# HTTP listener: /healthz, /readyz, /hooks/<pipeline> and /gate/tool-call.
# 0.0.0.0 so the Hostim proxy can reach the container port.
webhook:
  enabled: true
  addr: 0.0.0.0:8088
  secret_env: DRAFTCAT_WEBHOOK_SECRET
  max_body_bytes: 65536
  require_signature: true

# Tool-call gate for the agent harness (the same stack that uses KERNEL web
# MCP). Default deny: only tools listed here can be called. Listed without
# approval = allowed + audited. Side-effecting tools require operator approval.
tool_gate:
  enabled: true
  repeat_window: 10m
  max_repeats: 3
  notify_denials: true
  tools:
    # Read-only web surface used by the agent stack (web search/fetch + KERNEL
    # browser/webmcp calls) — allowed, audited.
    - name: web_search
    - name: web_fetch
    - name: browser_curl
    - name: browser_repl
    - name: webmcp
    # Side effects — every call goes to the operator channel for approval.
    - name: send_email
      risk: high
      require_approval: true
    - name: send_message
      risk: high
      require_approval: true
    - name: post_to_channel
      risk: high
      require_approval: true
    - name: refund
      risk: high
      require_approval: true

pipelines:
  - name: test-screener
    schedule: manual
    steps:
      - name: mock-input
        type: deterministic

      - name: classify
        type: ai
        skill: classify-job
        vars:
          profile: "AI/LLM, TypeScript, Go, cloud infra. $60/hr min."

      - name: review
        type: approval
        mode: hitl
        channel: telegram

      - name: log-result
        type: deterministic

# [email-digest] paused: connector missing (gmail token / GHL)
  - name: email-digest
    schedule: 30m
    steps:
      - name: fetch-unread
        type: deterministic
        action: gmail_unread

      - name: summarize
        type: ai
        skill: email-digest

      - name: report
        type: deterministic
        action: notify


